name: Build and Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 编译并验证（Windows）
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 确认系统编译器可用
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "runner 镜像缺少 .NET Framework csc：$csc" }
          # 注意：csc 没有 /version 选项（会报 CS2007），版本从文件属性读
          "compiler   : $csc"
          "file version: $((Get-Item $csc).VersionInfo.FileVersion)"

      - name: 架构不变量检查
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: python docs/harness/linters/invariant-check.py

      - name: 编译
        shell: pwsh
        run: ./build.ps1

      - name: 冒烟测试（生成 docx 并校验 OOXML）
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/smoke_test.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PaperToWord-windows
          path: |
            dist/PaperToWord.exe
            dist/使用说明.txt
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: PaperToWord-windows
          path: artifacts    # v4 会剥掉共同父目录 dist/，产物层级不固定，故递归查找

      - name: 创建 Release 并上传 exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          Get-ChildItem -Recurse artifacts | ForEach-Object { "artifact: $($_.FullName)" }
          # 不猜目录层级：递归定位（此前按 dist/ 前缀取，拿到的是 checkout 恢复的 git 文件）
          $exe  = (Get-ChildItem -Recurse -File -Filter PaperToWord.exe artifacts | Select-Object -First 1).FullName
          if (-not $exe) { throw "artifact 里没找到 PaperToWord.exe" }
          $docs = (Get-ChildItem -Recurse -File -Filter *.txt artifacts | Select-Object -First 1).FullName
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --title "PaperToWord $tag" `
              --notes "Windows 桌面工具：试卷原图对半裁开，一键排成 A4 的 Word。下载 PaperToWord.exe 双击即用（Win10/11 自带 .NET Framework 4.8，无需安装任何东西）。"
          }
          if ($docs) {
            gh release upload $tag $exe $docs --clobber
          } else {
            "警告：未找到说明 txt，只上传 exe"
            gh release upload $tag $exe --clobber
          }
          gh release view $tag
